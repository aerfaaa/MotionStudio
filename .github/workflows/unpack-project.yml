name: Unpack MotionStudio Project

on:

  workflow_dispatch:

permissions:

  contents: write

jobs:

  unpack:

    runs-on: ubuntu-latest

    steps:

      - name: Check out repository

        uses: actions/checkout@v4

        with:

          persist-credentials: true

      - name: Extract project files

        run: |

          if [ ! -f MotionStudio.zip ]; then

            echo "MotionStudio.zip was not found in the repository root."

            exit 1

          fi

          mkdir -p /tmp/motionstudio-source

          unzip -q MotionStudio.zip -d /tmp/motionstudio-source

          if [ ! -d /tmp/motionstudio-source/MotionStudio ]; then

            echo "Expected MotionStudio folder was not found in the ZIP."

            exit 1

          fi

          cp -R /tmp/motionstudio-source/MotionStudio/. .

          rm -f MotionStudio.zip

      - name: Commit extracted project

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit -m "Extract MotionStudio project files"

            git push

          fi
