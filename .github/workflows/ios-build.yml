# Builds the iPhone/iPad app on a Mac in the cloud. Manual only.
# Produces: logs, an unsigned .ipa (to sideload from Windows) and simulator screenshots.
#
# What each result proves:
#   Core tests green     -> the MotionCore logic compiles and its tests pass.
#   Simulator build      -> the app compiles for the simulator. It does NOT prove it works on a device.
#   Unsigned .ipa        -> the app compiles for devices. It still has to be signed to run on an iPhone.
#   Screenshots          -> the app launched in a simulator and drew something. They are not a device test.
name: iOS build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repository checks (no compiler needed)
        run: python3 scripts/check_repository.py

      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Run MotionCore tests
        working-directory: MotionCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../core-tests.log

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app for iPhone and iPad (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project MotionStudio.xcodeproj \
            -scheme MotionStudio \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild-device.log

      - name: Package an unsigned IPA
        run: |
          rm -rf Payload MotionStudio-unsigned.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MotionStudio.app Payload/
          zip -qr MotionStudio-unsigned.ipa Payload

      - name: Keep the logs (even when the build failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            core-tests.log
            xcodebuild-device.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: MotionStudio-unsigned-ipa
          path: MotionStudio-unsigned.ipa

  # Starts the app in the iOS Simulator and takes pictures, so you can see it without a Mac.
  screenshots:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project MotionStudio.xcodeproj \
            -scheme MotionStudio \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild-simulator.log

      - name: Take screenshots on an iPhone and an iPad simulator
        run: |
          mkdir -p screenshots
          for FAMILY in iPhone iPad; do
            UDID=$(xcrun simctl list devices available | grep -m1 "$FAMILY" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
            echo "Using $FAMILY simulator $UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" build-sim/Build/Products/Debug-iphonesimulator/MotionStudio.app
            xcrun simctl launch "$UDID" com.example.motionstudio -demo
            sleep 8
            xcrun simctl io "$UDID" screenshot "screenshots/$FAMILY.png"
            xcrun simctl shutdown "$UDID"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots-and-log
          path: |
            screenshots
            xcodebuild-simulator.log
          if-no-files-found: ignore
